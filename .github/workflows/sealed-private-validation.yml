name: Sealed Private Full Validation

on:
  push:
    branches:
      - "ci/sec-001d-closure"

permissions:
  contents: write

jobs:
  validate:
    name: Validate sealed SEC-001D integration target full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Run sealed full validation
        id: validate
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "1ad3173b8bdb81ac1b601b4b86c46144cfe4e56f"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"

          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "validation_status=configuration_error"
            exit 1
          fi

          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          unset REPOSITORY_META TARGET_REPOSITORY_ID

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          PRIVATE_LOG="$ROOT/private.log"
          JUNIT="$ROOT/results.xml"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() {
            chmod -R u+rwX "$ROOT" 2>/dev/null || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1
          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD 2>>"$PRIVATE_LOG")"
          if [[ "$ACTUAL_SHA" != "$TARGET_SHA" ]]; then
            echo "validation_status=checkout_mismatch"
            exit 1
          fi

          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY TARGET_SHA
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$PRIVATE_LOG" 2>&1 || true

          SEALED_ENV=(
            env
            -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY
            -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL
            -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          )

          cd "$SRC"
          "${SEALED_ENV[@]}" python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m pip check >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$PRIVATE_LOG" 2>&1
          for script in static/main.js static/ui-events.js static/lab-ui-events.js; do
            [[ ! -f "$script" ]] || node --check "$script" >>"$PRIVATE_LOG" 2>&1
          done

          "${SEALED_ENV[@]}" python -m pytest -q --tb=no --disable-warnings --timeout=60 \
            -o junit_family=legacy --junitxml="$JUNIT" >"$PRIVATE_LOG" 2>&1
          COUNTS="$(JUNIT_PATH="$JUNIT" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          def total(name): return sum(int(s.attrib.get(name, "0")) for s in suites)
          print(total("tests"), total("failures"), total("errors"), total("skipped"))
          PY
          )"
          read -r TESTS FAILURES ERRORS SKIPPED <<<"$COUNTS"

          "${SEALED_ENV[@]}" python -m build >"$PRIVATE_LOG" 2>&1
          WHEELS=(dist/*.whl)
          SDISTS=(dist/*.tar.gz)
          [[ -e "${WHEELS[0]}" ]]
          [[ -e "${SDISTS[0]}" ]]

          echo "tests=$TESTS failures=$FAILURES errors=$ERRORS skipped=$SKIPPED"
          echo "dependency_validation=passed"
          echo "compile=passed"
          echo "package_build=passed"
          echo "wheel=passed"
          echo "sdist=passed"
          echo "validation_status=passed"
          echo "tests=$TESTS" >>"$GITHUB_OUTPUT"
          echo "failures=$FAILURES" >>"$GITHUB_OUTPUT"
          echo "errors=$ERRORS" >>"$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >>"$GITHUB_OUTPUT"

      - name: Publish sanitized result marker
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ steps.validate.outputs.tests }}
          FAILURES: ${{ steps.validate.outputs.failures }}
          ERRORS: ${{ steps.validate.outputs.errors }}
          SKIPPED: ${{ steps.validate.outputs.skipped }}
          TARGET_SHA: "1ad3173b8bdb81ac1b601b4b86c46144cfe4e56f"
        run: |
          set -Eeuo pipefail
          PATH_NAME=".validation-results/sec-001d-full-${GITHUB_RUN_ID}.json"
          RESULT="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "schema": "sealed_validation_result_v1",
              "scope": "sec-001d-full",
              "target_sha": os.environ["TARGET_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "dependency_validation": "passed",
              "compile": "passed",
              "tests": int(os.environ["TESTS"]),
              "failures": int(os.environ["FAILURES"]),
              "errors": int(os.environ["ERRORS"]),
              "skipped": int(os.environ["SKIPPED"]),
              "package_build": "passed",
              "wheel": "passed",
              "sdist": "passed",
              "validation_status": "passed"
          }, sort_keys=True))
          PY
          )"
          ENCODED="$(printf '%s\n' "$RESULT" | base64 -w0)"
          export ENCODED
          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "message": "ci: publish sanitized SEC-001D full result [skip ci]",
              "content": os.environ["ENCODED"],
              "branch": "ci/sec-001d-closure"
          }))
          PY
          )"
          curl -fsS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}" \
            -d "$BODY" >/dev/null
