name: SEC-001E Final Exact SHA 87109f86

on:
  push:
    branches: [validate-sec001e-final-87109f86]

permissions: {}

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aichef
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d aichef"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"
      - name: Validate exact private final SHA
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "87109f860c673ba1ae6525ab881e0f3a1e222f8c"
          BASE_SHA: "6ac32138303d883c2d9a2d82dbcf44c7532715b6"
        run: |
          set -euo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          test -n "$TARGET_TOKEN"
          META="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          ROOT="$(mktemp -d)"; SRC="$ROOT/source"; LOG="$ROOT/private.log"; ASKPASS="$ROOT/askpass.sh"
          cleanup() { chmod -R u+rwX "$ROOT" 2>/dev/null || true; rm -rf "$ROOT"; }
          trap cleanup EXIT INT TERM
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"; export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$BASE_SHA" >>"$LOG" 2>&1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$TARGET_SHA"
          echo "sealed_target_sha=$TARGET_SHA"
          echo "base_sha=$BASE_SHA"
          echo "exact_sha=verified"
          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY META TARGET_REPOSITORY_ID
          rm -f "$ASKPASS"; git -C "$SRC" remote remove origin >>"$LOG" 2>&1 || true
          SEALED=(env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)
          cd "$SRC"

          "${SEALED[@]}" python -m pip install --disable-pip-version-check --no-input '.[dev]' >>"$LOG" 2>&1
          "${SEALED[@]}" python -m pip check >>"$LOG" 2>&1
          echo "pip_check=passed"
          "${SEALED[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$LOG" 2>&1
          echo "compileall=passed"

          summarize() {
            XML_PATH="$1" LABEL="$2" python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse(os.environ['XML_PATH']).getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=lambda k: sum(int(s.attrib.get(k,'0')) for s in suites)
          print(f"{os.environ['LABEL']}_tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          for c in root.iter('testcase'):
              x=c.find('failure')
              if x is None: x=c.find('error')
              if x is not None:
                  msg=(x.attrib.get('message') or '').replace('\n',' ')[:500]
                  print(f"failed_case={c.attrib.get('classname','')}::{c.attrib.get('name','')} message={msg}")
          PY
          }
          runq() {
            L="$1"; shift; X="$ROOT/$L.xml"
            set +e
            "${SEALED[@]}" python -m pytest -q "$@" --tb=no --disable-warnings --timeout=60 --timeout-method=thread -o junit_family=legacy --junitxml="$X" >>"$LOG" 2>&1
            R=$?
            set -e
            summarize "$X" "$L"
            return $R
          }

          FAILED=0
          runq p7_alone tests/test_p7_1d_acting_user.py || FAILED=1
          runq specialist \
            tests/test_sec001e_session_evidence.py \
            tests/test_sec001e_session_evidence_edges.py \
            tests/test_sec001e_od009.py \
            tests/test_privacy_export_owner_scope.py \
            tests/test_state_recovery_privacy_lifecycle.py \
            tests/test_p7_1d_acting_user.py || FAILED=1
          runq p7_reverse \
            tests/test_p7_1d_acting_user.py \
            tests/test_state_recovery_privacy_lifecycle.py \
            tests/test_privacy_export_owner_scope.py \
            tests/test_sec001e_od009.py \
            tests/test_sec001e_session_evidence_edges.py \
            tests/test_sec001e_session_evidence.py || FAILED=1

          mapfile -t TEST_ARGS < <(sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' tests/pr_core.txt)
          mapfile -t CHANGED_TEST_ARGS < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$TARGET_SHA" -- ':(glob)tests/**/test_*.py' | sort -u)
          for test_path in "${CHANGED_TEST_ARGS[@]}"; do
            test -f "$test_path" || continue
            if [[ " ${TEST_ARGS[*]} " != *" ${test_path} "* ]]; then TEST_ARGS+=("$test_path"); fi
          done
          for test_path in "${TEST_ARGS[@]}"; do test -f "$test_path"; done
          echo "pr_core_changed_selected_files=${#TEST_ARGS[@]}"
          EVIDENCE_DIR="$ROOT/regression-evidence"; PR_XML="$ROOT/pr_core_changed.xml"
          "${SEALED[@]}" python tools/regression_evidence.py init --output-dir "$EVIDENCE_DIR" --status not_started --commit-sha "$TARGET_SHA" >>"$LOG" 2>&1
          set +e
          "${SEALED[@]}" python tools/regression_evidence.py run \
            --output-dir "$EVIDENCE_DIR" \
            --reject-global-db-overrides \
            --commit-sha "$TARGET_SHA" \
            -- python -m pytest -q --tb=short --timeout=60 --timeout-method=thread \
            "${TEST_ARGS[@]}" -o junit_family=legacy --junitxml="$PR_XML" >>"$LOG" 2>&1
          PR_RC=$?
          set -e
          summarize "$PR_XML" pr_core_changed
          [[ $PR_RC -eq 0 ]] && echo "pr_core_changed=passed" || { echo "pr_core_changed=failed"; FAILED=1; }

          PG_XML="$ROOT/postgres.xml"
          set +e
          AI_CHEF_TEST_POSTGRES_URL='postgresql://postgres:postgres@127.0.0.1:5432/aichef' \
            "${SEALED[@]}" python -m pytest -q tests/test_sec001e_session_evidence_postgres.py \
            --tb=no --disable-warnings --timeout=90 --timeout-method=thread \
            -o junit_family=legacy --junitxml="$PG_XML" >>"$LOG" 2>&1
          PG_RC=$?
          set -e
          summarize "$PG_XML" postgres
          [[ $PG_RC -eq 0 ]] && echo "postgres=passed" || { echo "postgres=failed"; FAILED=1; }

          rm -rf dist
          if "${SEALED[@]}" python -m build >>"$LOG" 2>&1; then echo "build=passed"; else echo "build=failed"; FAILED=1; fi
          WHEEL="$(find dist -maxdepth 1 -name 'ai_chef_runtime-*.whl' -print -quit)"
          SDIST="$(find dist -maxdepth 1 -name 'ai_chef_runtime-*.tar.gz' -print -quit)"
          test -n "$WHEEL" && test -n "$SDIST"
          echo "wheel_artifact=$(basename "$WHEEL")"
          echo "sdist_artifact=$(basename "$SDIST")"

          VENV="$ROOT/installed-venv"; OUTSIDE="$ROOT/installed-run"
          python -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check --no-input --no-deps "$WHEEL" >>"$LOG" 2>&1
          test -x "$VENV/bin/ai-chef-migrate-session-evidence"
          "$VENV/bin/ai-chef-migrate-session-evidence" --help >>"$LOG" 2>&1
          echo "installed_cli=present"
          mkdir -p "$OUTSIDE/legacy"
          cat > "$OUTSIDE/legacy/chef_cockpit_sessions_v12.json" <<'JSON'
          {"schema":"chef_cockpit_sessions_v12","sessions":{"chef_installed":{"schema":"chef_cockpit_session_v12","session_id":"chef_installed","user_id":"creator","domain":"cooking","status":"active","marker":"installed-artifact","started_at":"2026-08-29T00:00:00+00:00","updated_at":"2026-08-29T00:00:00+00:00"}}}
          JSON
          cd "$OUTSIDE"
          export PYTHONPATH=""
          export AI_CHEF_DB_PATH="$OUTSIDE/runtime.sqlite3"
          "$VENV/bin/python" - <<'PY'
          from pathlib import Path
          import core
          from core import accounts
          path=Path(core.__file__).resolve()
          print(f"installed_core_path={path}")
          assert "site-packages" in str(path)
          assert accounts.public_account("creator") is not None
          PY
          "$VENV/bin/ai-chef-migrate-session-evidence" --legacy-root "$OUTSIDE/legacy" --pretty >>"$LOG" 2>&1
          "$VENV/bin/python" - <<'PY'
          from core.auth_context import desktop_owner_context
          from core import session_evidence_repository as repo
          row, revision = repo.load_snapshot(desktop_owner_context(), repo.KIND_COCKPIT, "chef_installed")
          assert row["marker"] == "installed-artifact"
          assert revision == 1
          print(f"installed_migration_record={row['session_id']} revision={revision}")
          PY
          echo "installed_artifact_migration=passed"

          echo "validation_status=$([[ $FAILED -eq 0 ]] && echo PASS || echo FAIL)"
          exit "$FAILED"
