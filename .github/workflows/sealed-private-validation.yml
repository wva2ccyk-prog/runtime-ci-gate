name: Sealed Private Validation
on:
  push:
    branches: [sec-001b-sealed-gate]
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: aichef_test
          POSTGRES_USER: aichef
          POSTGRES_PASSWORD: aichef-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aichef -d aichef_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with: {python-version: "3.11"}
      - name: Validate exact SEC-001B head
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "e2379e52ac72c65c929a80548707ff902d3ddb9a"
        run: |
          set -Eeuo pipefail; umask 077; printf '::add-mask::%s\n' "$TARGET_TOKEN"
          META="$(curl -fsS -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          REPO="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"; printf '::add-mask::%s\n' "$REPO"
          ROOT="$(mktemp -d)"; SRC="$ROOT/source"; LOG="$ROOT/private.log"; JUNIT="$ROOT/results.xml"; ASK="$ROOT/askpass.sh"; trap 'rm -rf "$ROOT"' EXIT INT TERM
          cat > "$ASK" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in *Username*) echo x-access-token;; *Password*) echo "$TARGET_TOKEN";; *) exit 1;; esac
          EOF
          chmod 700 "$ASK"; export GIT_ASKPASS="$ASK" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC"; git -C "$SRC" remote add origin "https://github.com/${REPO}.git"; git -C "$SRC" fetch -q --depth=1 origin "$TARGET_SHA"; git -C "$SRC" checkout -q --detach FETCH_HEAD; [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          unset TARGET_TOKEN GIT_ASKPASS META REPO TARGET_REPOSITORY_ID; rm -f "$ASK"; git -C "$SRC" remote remove origin >/dev/null 2>&1 || true; cd "$SRC"
          python -m pip install --disable-pip-version-check --no-input ".[dev]" >"$LOG" 2>&1
          python -m pip check >>"$LOG" 2>&1
          echo dependency_validation=passed
          python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$LOG" 2>&1
          for script in static/main.js static/ui-events.js static/lab-ui-events.js; do [[ ! -f "$script" ]] || node --check "$script" >>"$LOG" 2>&1; done
          echo compile=passed
          python -m pytest -q --tb=no --disable-warnings --timeout=120 -o junit_family=legacy --junitxml="$JUNIT" >"$LOG" 2>&1
          JUNIT_PATH="$JUNIT" python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse(os.environ['JUNIT_PATH']).getroot(); suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          def total(k): return sum(int(s.attrib.get(k,'0')) for s in suites)
          print(f"tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          PY
          echo full_pytest=passed
          AI_CHEF_TEST_POSTGRES_URL='postgresql://aichef:aichef-test-only@127.0.0.1:5432/aichef_test' \
          AI_CHEF_POSTGRES_INTEGRATION=1 AI_CHEF_DB_AUTO_MIGRATE=1 \
          python -m pytest -q --timeout=90 --timeout-method=thread tests/test_validation_capture_postgresql.py >>"$LOG" 2>&1
          echo validation_capture_postgres=passed
          python -m build >>"$LOG" 2>&1
          WHEEL=(dist/*.whl); SDIST=(dist/*.tar.gz); [[ -e "${WHEEL[0]}" && -e "${SDIST[0]}" ]]
          echo wheel=passed; echo sdist=passed
          python -m venv --system-site-packages "$ROOT/installed"
          "$ROOT/installed/bin/python" -m pip install --disable-pip-version-check --no-input --force-reinstall --no-deps "${WHEEL[0]}" >>"$LOG" 2>&1
          (cd "$ROOT"; PYTHONPATH= "$ROOT/installed/bin/python" -m core.validation_capture_migration --help >/dev/null)
          echo installed_artifact=passed
          echo validation_status=passed
