name: SEC-001E PR Core Diagnostic 2db9d07e
on:
  push:
    branches: [diagnose-sec001e-prcore-2db9d07e]
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.11'
      - shell: bash
        env:
          TARGET_REPOSITORY_ID: '1317466526'
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: 2db9d07edc98f5d721674b2e929badbaf379aa69
        run: |
          set -u; umask 077; printf '::add-mask::%s\n' "$TARGET_TOKEN"
          META="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")" || exit 1
          REPO="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')" || exit 1
          printf '::add-mask::%s\n' "$REPO"
          ROOT="$(mktemp -d)"; SRC="$ROOT/src"; LOG="$ROOT/private.log"; ASK="$ROOT/askpass.sh"; trap 'rm -rf "$ROOT"' EXIT
          cat > "$ASK" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in *Username*) echo x-access-token;; *Password*) echo "$TARGET_TOKEN";; *) exit 1;; esac
          EOF
          chmod 700 "$ASK"; export GIT_ASKPASS="$ASK" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC"; git -C "$SRC" remote add origin "https://github.com/${REPO}.git"; git -C "$SRC" fetch -q --depth=1 origin "$TARGET_SHA"; git -C "$SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$TARGET_SHA"; echo "exact_sha=verified:$TARGET_SHA"
          unset TARGET_TOKEN GIT_ASKPASS REPO META; cd "$SRC"; python -m pip install --disable-pip-version-check --no-input '.[dev]' >>"$LOG" 2>&1 || exit 1
          FAILED=0
          while IFS= read -r TEST; do
            TEST="${TEST%%#*}"; TEST="$(echo "$TEST" | xargs)"; test -z "$TEST" && continue
            XML="$ROOT/$(basename "$TEST").xml"
            if python -m pytest -q "$TEST" --tb=no --disable-warnings --timeout=90 -o junit_family=legacy --junitxml="$XML" >>"$LOG" 2>&1; then RC=0; else RC=$?; FAILED=1; fi
            XML="$XML" TEST="$TEST" python - <<'PY'
          import os,xml.etree.ElementTree as ET
          r=ET.parse(os.environ['XML']).getroot(); suites=[r] if r.tag=='testsuite' else list(r.findall('testsuite')); t=lambda k:sum(int(s.attrib.get(k,'0')) for s in suites)
          print(f"file={os.environ['TEST']} tests={t('tests')} failures={t('failures')} errors={t('errors')} skipped={t('skipped')}")
          for c in r.iter('testcase'):
              x=c.find('failure'); x=x if x is not None else c.find('error')
              if x is not None: print(f"failed_case={c.attrib.get('classname','')}::{c.attrib.get('name','')} message={(x.attrib.get('message') or '').replace(chr(10),' ')[:280]}")
          PY
          done < tests/pr_core.txt
          echo "diagnostic_failed=$FAILED"; exit "$FAILED"
