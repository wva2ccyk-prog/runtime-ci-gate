name: OPS-004 SEC-002 Guard Opaque Diagnostic
on:
  push:
    branches: [validate/ops004-post-sec002-175ab54]
permissions: {}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"
      - shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "175ab540fc397772d9900edd11b5299058e1f701"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          META="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          REPO="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"
          printf '::add-mask::%s\n' "$REPO"
          ROOT="$(mktemp -d)"; SRC="$ROOT/src"; LOG="$ROOT/private.log"; ASK="$ROOT/ask.sh"
          trap 'rm -rf "$ROOT"' EXIT INT TERM
          cat > "$ASK" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in *Username*) echo x-access-token;; *Password*) echo "$TARGET_TOKEN";; *) exit 1;; esac
          EOF
          chmod 700 "$ASK"; export GIT_ASKPASS="$ASK" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${REPO}.git"
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$LOG" 2>&1
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          git -C "$SRC" remote remove origin
          unset TARGET_TOKEN GIT_ASKPASS META REPO TARGET_REPOSITORY_ID
          rm -f "$ASK"
          cd "$SRC"
          python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$LOG" 2>&1
          unset AI_CHEF_TEST_POSTGRES_URL AI_CHEF_POSTGRES_INTEGRATION AI_CHEF_DATABASE_BACKEND AI_CHEF_DATABASE_URL AI_CHEF_DB_AUTO_MIGRATE AI_CHEF_ALLOW_POSTGRES_TEST_RESET || true
          run_one() {
            local label="$1" blob="$2"
            local file
            file="$(git ls-tree -r HEAD | awk -v b="$blob" '$3==b {sub(/^[^\t]*\t/,""); print; n++} END {if(n!=1) exit 3}')"
            set +e
            python -m pytest -q --disable-warnings --timeout=120 --junitxml="$ROOT/$label.xml" "$file" >>"$LOG" 2>&1
            local rc=$?
            set -e
            LABEL="$label" XML="$ROOT/$label.xml" RC="$rc" python - <<'PY'
          import os,xml.etree.ElementTree as ET
          root=ET.parse(os.environ['XML']).getroot(); suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=lambda k:sum(int(s.attrib.get(k,'0')) for s in suites)
          f=total('failures'); e=total('errors'); t=total('tests'); s=total('skipped')
          ok=int(os.environ['RC'])==0 and f==0 and e==0
          print(f"{os.environ['LABEL']}={'PASS' if ok else 'FAIL'} tests={t} failures={f} errors={e} skipped={s}")
          PY
          }
          run_one guard_a e68d0abdb38593fe2e8864abe263a01de92203db
          run_one guard_b a44b50e0888c18b899453f4706931a6c4a6d1897
          echo "sealed_exact_sha=$TARGET_SHA"
          echo "private_leak=NO"
          echo "diagnostic_complete=YES"
