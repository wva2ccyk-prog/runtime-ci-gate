name: SEC-003 Sealed Validation

on:
  push:
    branches:
      - validate-sec003-becc924b

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"

      - name: Validate exact private SEC-003 head
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "becc924bc073f44f44569f17cd4130493b287180"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "validation_status=configuration_error"
            exit 1
          fi

          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          unset REPOSITORY_META TARGET_REPOSITORY_ID

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          PRIVATE_LOG="$ROOT/private.log"
          JUNIT="$ROOT/results.xml"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() {
            chmod -R u+rwX "$ROOT" 2>/dev/null || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1
          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD 2>>"$PRIVATE_LOG")"
          if [[ "$ACTUAL_SHA" != "$TARGET_SHA" ]]; then
            echo "validation_status=checkout_mismatch"
            exit 1
          fi

          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY
          rm -f "$ASKPASS"
          SEALED_ENV=(env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)

          cd "$SRC"
          "${SEALED_ENV[@]}" python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m pip check >>"$PRIVATE_LOG" 2>&1
          echo "dependency=passed"

          "${SEALED_ENV[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$PRIVATE_LOG" 2>&1
          echo "compile=passed"

          "${SEALED_ENV[@]}" python -m pytest -q tests/test_sec003_startup_safety.py tests/test_phase5_api_deployment.py tests/test_secret_store.py tests/test_settings_secret_encryption.py --tb=no --disable-warnings --timeout=60 >>"$PRIVATE_LOG" 2>&1
          echo "focused=passed"

          "${SEALED_ENV[@]}" python -m pytest -q --tb=no --disable-warnings --timeout=60 -o junit_family=legacy --junitxml="$JUNIT" >"$PRIVATE_LOG" 2>&1
          JUNIT_PATH="$JUNIT" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          def total(name): return sum(int(s.attrib.get(name, "0")) for s in suites)
          print(f"tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          PY
          echo "full_suite=passed"

          "${SEALED_ENV[@]}" python -m build >"$PRIVATE_LOG" 2>&1
          WHEELS=(dist/*.whl)
          SDISTS=(dist/*.tar.gz)
          [[ -e "${WHEELS[0]}" && -e "${SDISTS[0]}" ]]
          echo "wheel=passed"
          echo "sdist=passed"

          python -m venv "$ROOT/installed"
          "$ROOT/installed/bin/python" -m pip install --disable-pip-version-check --no-input "${WHEELS[0]}" >>"$PRIVATE_LOG" 2>&1
          (
            cd "$ROOT"
            AI_CHEF_DEPLOYMENT_PROFILE=desktop AI_CHEF_WORKERS=1 "$ROOT/installed/bin/ai-chef-runtime" --check >>"$PRIVATE_LOG" 2>&1
            AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_WORKERS=1 AI_CHEF_REGISTRATION=closed AI_CHEF_ALLOWED_HOSTS=chef.example.test "$ROOT/installed/bin/ai-chef-runtime" --check >>"$PRIVATE_LOG" 2>&1
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_WORKERS=1 AI_CHEF_REGISTRATION=open AI_CHEF_ALLOWED_HOSTS=chef.example.test "$ROOT/installed/bin/ai-chef-runtime" --check >>"$PRIVATE_LOG" 2>&1; then exit 1; fi
            grep -q 'registration_open_not_supported' "$PRIVATE_LOG"
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_HOST=0.0.0.0 AI_CHEF_ALLOWED_HOSTS=chef.example.test "$ROOT/installed/bin/ai-chef-runtime" --check >>"$PRIVATE_LOG" 2>&1; then exit 1; fi
            grep -q 'wildcard_host_not_approved' "$PRIVATE_LOG"
            SECRET='sec003-installed-redaction-secret'
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_REGISTRATION=open AI_CHEF_DATABASE_BACKEND=postgresql AI_CHEF_DATABASE_URL="postgresql://chef:${SECRET}@db.example.test/chef" "$ROOT/installed/bin/ai-chef-runtime" --check >>"$PRIVATE_LOG" 2>&1; then exit 1; fi
            if grep -q "$SECRET" "$PRIVATE_LOG"; then exit 1; fi
          )
          echo "installed_artifact=passed"
          echo "installed_check_matrix=passed"
          echo "validation_status=passed"
