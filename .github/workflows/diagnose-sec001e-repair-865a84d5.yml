name: SEC-001E Repair Diagnostic 865a84d5

on:
  push:
    branches: [diagnose-sec001e-repair-865a84d5]

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aichef}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d aichef"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with: {python-version: "3.11"}
      - name: Diagnose exact private SHA
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "865a84d5d54cd836a30befe165da39a1ccfad59c"
          BASE_SHA: "6ac32138303d883c2d9a2d82dbcf44c7532715b6"
        run: |
          set -euo pipefail; umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"; test -n "$TARGET_TOKEN"
          META="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          ROOT="$(mktemp -d)"; SRC="$ROOT/source"; LOG="$ROOT/private.log"; ASKPASS="$ROOT/askpass.sh"
          cleanup() { chmod -R u+rwX "$ROOT" 2>/dev/null || true; rm -rf "$ROOT"; }; trap cleanup EXIT INT TERM
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in *Username*) echo x-access-token;; *Password*) echo "$TARGET_TOKEN";; *) exit 1;; esac
          EOF
          chmod 700 "$ASKPASS"; export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$LOG" 2>&1; git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$LOG" 2>&1; git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$BASE_SHA" >>"$LOG" 2>&1; test "$(git -C "$SRC" rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_sha=verified:$TARGET_SHA"
          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY META TARGET_REPOSITORY_ID; rm -f "$ASKPASS"; git -C "$SRC" remote remove origin >>"$LOG" 2>&1 || true
          SEALED=(env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)
          cd "$SRC"
          "${SEALED[@]}" python -m pip install --disable-pip-version-check --no-input '.[dev]' >>"$LOG" 2>&1
          "${SEALED[@]}" python -m pip check >>"$LOG" 2>&1; echo pip_check=passed
          "${SEALED[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$LOG" 2>&1; echo compileall=passed
          summarize() { XML_PATH="$1" LABEL="$2" python - <<'PY'
          import os, xml.etree.ElementTree as ET
          r=ET.parse(os.environ['XML_PATH']).getroot(); ss=[r] if r.tag=='testsuite' else list(r.findall('testsuite')); t=lambda k: sum(int(s.attrib.get(k,'0')) for s in ss)
          print(f"{os.environ['LABEL']}_tests={t('tests')} failures={t('failures')} errors={t('errors')} skipped={t('skipped')}")
          for c in r.iter('testcase'):
              x=c.find('failure')
              if x is None: x=c.find('error')
              if x is not None: print(f"failed_case={c.attrib.get('classname','')}::{c.attrib.get('name','')} message={(x.attrib.get('message') or '').replace(chr(10),' ')[:500]}")
          PY
          }
          runq() { L="$1"; shift; X="$ROOT/$L.xml"; set +e; "${SEALED[@]}" python -m pytest -q "$@" --tb=no --disable-warnings --timeout=60 --timeout-method=thread -o junit_family=legacy --junitxml="$X" >>"$LOG" 2>&1; R=$?; set -e; summarize "$X" "$L"; return $R; }
          FAILED=0
          runq p7_alone tests/test_p7_1d_acting_user.py || FAILED=1
          runq specialist tests/test_sec001e_session_evidence.py tests/test_sec001e_session_evidence_edges.py tests/test_sec001e_od009.py tests/test_privacy_export_owner_scope.py tests/test_state_recovery_privacy_lifecycle.py tests/test_p7_1d_acting_user.py || FAILED=1
          runq reverse tests/test_p7_1d_acting_user.py tests/test_state_recovery_privacy_lifecycle.py tests/test_privacy_export_owner_scope.py tests/test_sec001e_od009.py tests/test_sec001e_session_evidence_edges.py tests/test_sec001e_session_evidence.py || FAILED=1
          mapfile -t T < <(sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' tests/pr_core.txt); mapfile -t C < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$TARGET_SHA" -- ':(glob)tests/**/test_*.py' | sort -u)
          for p in "${C[@]}"; do test -f "$p" || continue; [[ " ${T[*]} " == *" $p "* ]] || T+=("$p"); done; echo "pr_core_changed_selected=${#T[@]}"
          E="$ROOT/e"; P="$ROOT/pr.xml"; "${SEALED[@]}" python tools/regression_evidence.py init --output-dir "$E" --status not_started --commit-sha "$TARGET_SHA" >>"$LOG" 2>&1
          set +e; "${SEALED[@]}" python tools/regression_evidence.py run --output-dir "$E" --reject-global-db-overrides --commit-sha "$TARGET_SHA" -- python -m pytest -q --tb=short --timeout=60 --timeout-method=thread "${T[@]}" -o junit_family=legacy --junitxml="$P" >>"$LOG" 2>&1; R=$?; set -e; summarize "$P" pr_core_changed; [[ $R -eq 0 ]] && echo pr_core_changed=passed || { echo pr_core_changed=failed; FAILED=1; }
          PG="$ROOT/pg.xml"; set +e; AI_CHEF_TEST_POSTGRES_URL='postgresql://postgres:postgres@127.0.0.1:5432/aichef' "${SEALED[@]}" python -m pytest -q tests/test_sec001e_session_evidence_postgres.py --tb=no --disable-warnings --timeout=90 --timeout-method=thread -o junit_family=legacy --junitxml="$PG" >>"$LOG" 2>&1; R=$?; set -e; summarize "$PG" postgres; [[ $R -eq 0 ]] && echo postgres=passed || { echo postgres=failed; FAILED=1; }
          echo "diagnostic_status=$([[ $FAILED -eq 0 ]] && echo passed || echo failed)"; exit "$FAILED"
