name: SEC-003 Exact SHA Validation

on:
  push:
    branches:
      - validate-sec003-63cca693

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"

      - name: Validate exact private SEC-003 head
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "63cca693b6418287c2fe19e8ca7efe90ce362f82"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "validation_status=configuration_error"
            exit 1
          fi

          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          unset REPOSITORY_META TARGET_REPOSITORY_ID

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          PRIVATE_LOG="$ROOT/private.log"
          JUNIT="$ROOT/results.xml"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() {
            chmod -R u+rwX "$ROOT" 2>/dev/null || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1
          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD 2>>"$PRIVATE_LOG")"
          if [[ "$ACTUAL_SHA" != "$TARGET_SHA" ]]; then
            echo "validation_status=checkout_mismatch"
            exit 1
          fi
          echo "exact_sha=verified"

          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$PRIVATE_LOG" 2>&1 || true

          SEALED_ENV=(
            env
            -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY
            -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL
            -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          )

          cd "$SRC"
          "${SEALED_ENV[@]}" python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m pip check >>"$PRIVATE_LOG" 2>&1
          echo "pip_check=passed"

          "${SEALED_ENV[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$PRIVATE_LOG" 2>&1
          for script in static/main.js static/ui-events.js static/lab-ui-events.js; do
            [[ ! -f "$script" ]] || node --check "$script" >>"$PRIVATE_LOG" 2>&1
          done
          echo "compileall=passed"

          "${SEALED_ENV[@]}" python -m pytest -q tests/test_sec003_startup_safety.py --tb=no --disable-warnings --timeout=60 >>"$PRIVATE_LOG" 2>&1
          echo "sec003=passed"

          "${SEALED_ENV[@]}" python -m pytest -q tests/test_phase5_api_deployment.py --tb=no --disable-warnings --timeout=60 >>"$PRIVATE_LOG" 2>&1
          echo "request_boundary_deployment=passed"

          "${SEALED_ENV[@]}" python -m pytest -q tests -k 'database or postgres or sqlite' --tb=no --disable-warnings --timeout=60 >>"$PRIVATE_LOG" 2>&1
          echo "database_config=passed"

          "${SEALED_ENV[@]}" python -m pytest -q tests -k 'startup or launcher or runtime_config or run_server' --tb=no --disable-warnings --timeout=60 >>"$PRIVATE_LOG" 2>&1
          echo "startup_launcher=passed"

          "${SEALED_ENV[@]}" python -m pytest -q tests/test_secret_store.py tests/test_settings_secret_encryption.py --tb=no --disable-warnings --timeout=60 >>"$PRIVATE_LOG" 2>&1
          echo "secret_policy_compatibility=passed"

          set +e
          "${SEALED_ENV[@]}" python -m pytest -q --tb=no --disable-warnings --timeout=60 \
            -o junit_family=legacy --junitxml="$JUNIT" >"$PRIVATE_LOG" 2>&1
          FULL_STATUS=$?
          set -e
          JUNIT_PATH="$JUNIT" FULL_STATUS="$FULL_STATUS" python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          def total(name):
              return sum(int(s.attrib.get(name, "0")) for s in suites)
          tests = total("tests")
          failures = total("failures")
          errors = total("errors")
          skipped = total("skipped")
          print(f"full_tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if int(os.environ["FULL_STATUS"]) != 0:
              buckets = {"sec003": 0, "deployment": 0, "database": 0, "secret": 0, "startup": 0, "other": 0}
              for case in root.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  text = f"{case.attrib.get('classname', '')} {case.attrib.get('name', '')}".lower()
                  if "sec003" in text:
                      buckets["sec003"] += 1
                  elif "deployment" in text or "host" in text:
                      buckets["deployment"] += 1
                  elif "database" in text or "postgres" in text or "sqlite" in text:
                      buckets["database"] += 1
                  elif "secret" in text or "settings" in text:
                      buckets["secret"] += 1
                  elif "startup" in text or "launcher" in text or "run_server" in text:
                      buckets["startup"] += 1
                  else:
                      buckets["other"] += 1
              print("full_failure_buckets=" + ",".join(f"{key}:{value}" for key, value in buckets.items()))
              sys.exit(1)
          PY
          echo "full_pytest=passed"

          "${SEALED_ENV[@]}" python -m build >"$PRIVATE_LOG" 2>&1
          WHEELS=(dist/*.whl)
          SDISTS=(dist/*.tar.gz)
          [[ -e "${WHEELS[0]}" && -e "${SDISTS[0]}" ]]
          echo "wheel=passed"
          echo "sdist=passed"

          python -m venv "$ROOT/installed"
          "$ROOT/installed/bin/python" -m pip install --disable-pip-version-check --no-input "${WHEELS[0]}" >>"$PRIVATE_LOG" 2>&1
          "$ROOT/installed/bin/python" -m pip check >>"$PRIVATE_LOG" 2>&1
          (
            cd "$ROOT"
            SETTINGS="$ROOT/settings.json"
            CLI="$ROOT/installed/bin/ai-chef-runtime"

            AI_CHEF_DEPLOYMENT_PROFILE=desktop AI_CHEF_WORKERS=1 AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >>"$PRIVATE_LOG" 2>&1

            AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_HOST=127.0.0.1 AI_CHEF_WORKERS=1 AI_CHEF_REGISTRATION=closed AI_CHEF_ENABLE_LAB_API=0 AI_CHEF_ALLOWED_HOSTS=chef.example.test AI_CHEF_DATABASE_BACKEND=sqlite AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >>"$PRIVATE_LOG" 2>&1

            AI_CHEF_DEPLOYMENT_PROFILE=lan AI_CHEF_HOST=192.168.50.10 AI_CHEF_WORKERS=1 AI_CHEF_REGISTRATION=closed AI_CHEF_ENABLE_LAB_API=0 AI_CHEF_ALLOWED_HOSTS=kitchen.local AI_CHEF_DATABASE_BACKEND=sqlite AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >>"$PRIVATE_LOG" 2>&1

            LAN_FAIL="$ROOT/lan-fail.log"
            if AI_CHEF_DEPLOYMENT_PROFILE=lan AI_CHEF_HOST=192.168.50.10 AI_CHEF_WORKERS=1 AI_CHEF_REGISTRATION=closed AI_CHEF_ENABLE_LAB_API=0 AI_CHEF_DATABASE_BACKEND=sqlite AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >"$LAN_FAIL" 2>&1; then exit 1; fi
            grep -q 'public_bind_without_allowed_hosts' "$LAN_FAIL"

            REG_FAIL="$ROOT/reg-fail.log"
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_WORKERS=1 AI_CHEF_REGISTRATION=open AI_CHEF_ALLOWED_HOSTS=chef.example.test AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >"$REG_FAIL" 2>&1; then exit 1; fi
            grep -q 'registration_open_not_supported' "$REG_FAIL"

            HOST_FAIL="$ROOT/host-fail.log"
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_HOST=0.0.0.0 AI_CHEF_ALLOWED_HOSTS=chef.example.test AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >"$HOST_FAIL" 2>&1; then exit 1; fi
            grep -q 'wildcard_host_not_approved' "$HOST_FAIL"

            PG_FAIL="$ROOT/pg-fail.log"
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_WORKERS=2 AI_CHEF_ALLOWED_HOSTS=chef.example.test AI_CHEF_DATABASE_BACKEND=postgresql AI_CHEF_DATABASE_URL='postgresql://chef:qualification-only@db.example.test/chef' AI_CHEF_ENABLE_POSTGRES_MULTI_WORKER=1 AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >"$PG_FAIL" 2>&1; then exit 1; fi
            grep -q 'postgres_multi_worker_not_qualified' "$PG_FAIL"

            SECRET='sec003-installed-redaction-secret'
            REDACTION_FAIL="$ROOT/redaction-fail.log"
            if AI_CHEF_DEPLOYMENT_PROFILE=server AI_CHEF_REGISTRATION=open AI_CHEF_ALLOWED_HOSTS=chef.example.test AI_CHEF_DATABASE_BACKEND=postgresql AI_CHEF_DATABASE_URL="postgresql://chef:${SECRET}@db.example.test/chef" AI_CHEF_SETTINGS_PATH="$SETTINGS" "$CLI" --check >"$REDACTION_FAIL" 2>&1; then exit 1; fi
            grep -q 'registration_open_not_supported' "$REDACTION_FAIL"
            if grep -q "$SECRET" "$REDACTION_FAIL"; then exit 1; fi
          )
          "$ROOT/installed/bin/python" -c 'import core.deployment, core.run_server' >>"$PRIVATE_LOG" 2>&1
          echo "installed_wheel_smoke=passed"
          echo "installed_check_matrix=passed"
          echo "validation_status=passed"
