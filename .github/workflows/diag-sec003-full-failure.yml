name: SEC-003 Encrypted Full Failure Diagnostic

on:
  push:
    branches:
      - validate-sec003-63cca693

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"
      - name: Run encrypted diagnostic
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "63cca693b6418287c2fe19e8ca7efe90ce362f82"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          [[ -n "$TARGET_TOKEN" ]]

          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          LOG="$ROOT/private.log"
          JUNIT="$ROOT/results.xml"
          ASKPASS="$ROOT/askpass.sh"
          trap 'rm -rf "$ROOT"' EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$LOG" 2>&1
          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          unset TARGET_TOKEN TARGET_REPOSITORY GIT_ASKPASS REPOSITORY_META TARGET_REPOSITORY_ID
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$LOG" 2>&1 || true

          cd "$SRC"
          python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$LOG" 2>&1
          set +e
          python -m pytest -q --tb=no --disable-warnings --timeout=60 -o junit_family=legacy --junitxml="$JUNIT" >"$LOG" 2>&1
          STATUS=$?
          set -e

          JUNIT_PATH="$JUNIT" DIAG_PATH="$ROOT/diag.json" STATUS="$STATUS" python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          failures = []
          for case in root.iter("testcase"):
              node = case.find("failure") or case.find("error")
              if node is not None:
                  failures.append({
                      "classname": case.attrib.get("classname", ""),
                      "name": case.attrib.get("name", ""),
                      "message": node.attrib.get("message", ""),
                      "detail": (node.text or "")[:2000],
                  })
          with open(os.environ["DIAG_PATH"], "w", encoding="utf-8") as fh:
              json.dump({"status": int(os.environ["STATUS"]), "failures": failures}, fh)
          print(f"diagnostic_failures={len(failures)}")
          PY

          cat > "$ROOT/pub.pem" <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA3yNrzcpEbmA8fcS4rtkX
          tGmLUcKycpDZDSWpvnLEjbYQZ46/DUr4hsv5Pl+rP8PeRHx9xD840hLu8WT+62kp
          Kv/Lg2mIVuT2VCL0RoAPMb/1jr9Wln9ff1AKSotP9o8JtbDRL0MWUFF/F3f41bkF
          NF7DVx7lEe2u2iwEC6iKaImVSt8lZmGlgGEtNU1QnfZGO0cuwTCOG/R5R0UrGv71
          p3Elt1uqCsVPZeqfhpmuH8rmq0rG6lMJOImNW+P2WA6li9e+r+boSElabI7XcUVC
          dzdnwWvD1ZyjjvwYr9vMDR9K3XmvZXbukf6NVLKYHn4YoaKJnltvrPmkelPqd0XB
          mwIDAQAB
          -----END PUBLIC KEY-----
          EOF
          openssl rand 32 > "$ROOT/aes.key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:"$ROOT/aes.key" -in "$ROOT/diag.json" -out "$ROOT/diag.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$ROOT/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$ROOT/aes.key" -out "$ROOT/aes.key.enc"
          echo "diagnostic_key_b64=$(base64 -w0 "$ROOT/aes.key.enc")"
          echo "diagnostic_data_b64=$(base64 -w0 "$ROOT/diag.enc")"
          echo "diagnostic_status=encrypted"
