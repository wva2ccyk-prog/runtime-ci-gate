name: OPS-004 Full Suite Opaque Diagnostic
on:
  push:
    branches: [validate/ops004-post-sec002-175ab54]
permissions: {}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"
      - shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "92a84bff00b3bbc69c0e02206f4d76c8b6c9438f"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          META="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          REPO="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"
          printf '::add-mask::%s\n' "$REPO"
          ROOT="$(mktemp -d)"; SRC="$ROOT/src"; LOG="$ROOT/private.log"; ASK="$ROOT/ask.sh"
          trap 'rm -rf "$ROOT"' EXIT INT TERM
          cat > "$ASK" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in *Username*) echo x-access-token;; *Password*) echo "$TARGET_TOKEN";; *) exit 1;; esac
          EOF
          chmod 700 "$ASK"; export GIT_ASKPASS="$ASK" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${REPO}.git"
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$LOG" 2>&1
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          git -C "$SRC" remote remove origin
          unset TARGET_TOKEN GIT_ASKPASS META REPO TARGET_REPOSITORY_ID
          rm -f "$ASK"
          cd "$SRC"
          python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$LOG" 2>&1
          unset AI_CHEF_TEST_POSTGRES_URL AI_CHEF_POSTGRES_INTEGRATION AI_CHEF_DATABASE_BACKEND AI_CHEF_DATABASE_URL AI_CHEF_DB_AUTO_MIGRATE AI_CHEF_ALLOW_POSTGRES_TEST_RESET AI_CHEF_TEST_INSTALLED_BIN_DIR || true
          set +e
          python -m pytest -q --disable-warnings --timeout=120 --junitxml="$ROOT/full.xml" >>"$LOG" 2>&1
          RC=$?
          set -e
          SRC="$SRC" XML="$ROOT/full.xml" RC="$RC" python - <<'PY'
          import ast, os, re, subprocess, xml.etree.ElementTree as ET
          src=os.environ['SRC']
          root=ET.parse(os.environ['XML']).getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=lambda k:sum(int(s.attrib.get(k,'0')) for s in suites)
          print(f"clean_full_diagnostic tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          found=[]
          for case in root.iter('testcase'):
              node=case.find('failure')
              if node is None: node=case.find('error')
              if node is None: continue
              classname=case.attrib.get('classname') or ''
              testname=(case.attrib.get('name') or '').split('[',1)[0]
              parts=classname.split('.') if classname else []
              path=None
              for i in range(len(parts),0,-1):
                  candidate='/'.join(parts[:i])+'.py'
                  try:
                      subprocess.check_call(['git','-C',src,'cat-file','-e',f'HEAD:{candidate}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      path=candidate; break
                  except subprocess.CalledProcessError: pass
              if path is None and testname:
                  hits=[]
                  for p in subprocess.check_output(['git','-C',src,'ls-files','tests/*.py'],text=True).splitlines():
                      try: text=open(os.path.join(src,p),encoding='utf-8').read()
                      except Exception: continue
                      if re.search(r'^\s*(?:async\s+)?def\s+'+re.escape(testname)+r'\s*\(',text,re.M): hits.append(p)
                  if len(hits)==1: path=hits[0]
              blob='unmapped'; line='unknown'
              if path:
                  blob=subprocess.check_output(['git','-C',src,'rev-parse',f'HEAD:{path}'],text=True).strip()
                  try:
                      tree=ast.parse(open(os.path.join(src,path),encoding='utf-8').read())
                      for n in ast.walk(tree):
                          if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name==testname:
                              line=str(min([n.lineno]+[d.lineno for d in n.decorator_list])); break
                  except Exception: pass
              raw=(node.attrib.get('type') or '')+' '+(node.text or '')
              m=re.search(r'\b([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception))\b',raw)
              typ=(m.group(1).rsplit('.',1)[-1] if m else 'unknown')
              found.append((blob,typ,line))
          for i,(blob,typ,line) in enumerate(found,1): print(f"failure_{i}=blob:{blob} class:{typ} definition:{line}")
          if len(found)!=total('failures')+total('errors') or any(x[0]=='unmapped' for x in found):
              print('failure_mapping=INCOMPLETE'); raise SystemExit(2)
          PY
          echo "sealed_exact_sha=$TARGET_SHA"
          echo "private_leak=NO"
          echo "diagnostic_complete=YES"
