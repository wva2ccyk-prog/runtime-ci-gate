name: SEC-001E Repair Diagnostic 407331eb

on:
  push:
    branches:
      - diagnose-sec001e-repair-407331eb

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aichef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aichef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"

      - name: Diagnose exact private repair head
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "407331eb1398a39d2438676c797ee4af17036308"
          BASE_SHA: "6ac32138303d883c2d9a2d82dbcf44c7532715b6"
        run: |
          set -u
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ || ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "diagnostic_status=configuration_error"
            exit 1
          fi
          META="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")" || exit 1
          TARGET_REPOSITORY="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')" || exit 1
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          PRIVATE_LOG="$ROOT/private.log"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() { chmod -R u+rwX "$ROOT" 2>/dev/null || true; rm -rf "$ROOT"; }
          trap cleanup EXIT INT TERM
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1 || exit 1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1 || exit 1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1 || exit 1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1 || exit 1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$BASE_SHA" >>"$PRIVATE_LOG" 2>&1 || exit 1
          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]] || exit 1
          echo "exact_sha=verified:$TARGET_SHA"
          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY META TARGET_REPOSITORY_ID
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$PRIVATE_LOG" 2>&1 || true
          SEALED_ENV=(env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)
          cd "$SRC"

          "${SEALED_ENV[@]}" python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$PRIVATE_LOG" 2>&1 || { echo "install=failed"; exit 1; }
          "${SEALED_ENV[@]}" python -m pip check >>"$PRIVATE_LOG" 2>&1 || { echo "pip_check=failed"; exit 1; }
          echo "pip_check=passed"
          "${SEALED_ENV[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$PRIVATE_LOG" 2>&1 || { echo "compileall=failed"; exit 1; }
          echo "compileall=passed"

          summarize_xml() {
            XML_PATH="$1" LABEL="$2" python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse(os.environ['XML_PATH']).getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=lambda key: sum(int(s.attrib.get(key,'0')) for s in suites)
          print(f"{os.environ['LABEL']}_tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          for case in root.iter('testcase'):
              issue=case.find('failure')
              if issue is None: issue=case.find('error')
              if issue is not None:
                  msg=(issue.attrib.get('message') or '').replace('\n',' ')[:320]
                  print(f"failed_case={case.attrib.get('classname','')}::{case.attrib.get('name','unknown')} message={msg}")
          PY
          }

          run_pytest() {
            LABEL="$1"
            shift
            XML="$ROOT/${LABEL}.xml"
            if "${SEALED_ENV[@]}" python -m pytest -q "$@" --tb=no --disable-warnings --timeout=60 --timeout-method=thread -o junit_family=legacy --junitxml="$XML" >>"$PRIVATE_LOG" 2>&1; then
              RC=0
            else
              RC=$?
            fi
            summarize_xml "$XML" "$LABEL"
            return "$RC"
          }

          FAILED=0
          run_pytest p7_alone tests/test_p7_1d_acting_user.py || FAILED=1
          run_pytest specialist \
            tests/test_sec001e_session_evidence.py \
            tests/test_sec001e_session_evidence_edges.py \
            tests/test_sec001e_od009.py \
            tests/test_privacy_export_owner_scope.py \
            tests/test_state_recovery_privacy_lifecycle.py \
            tests/test_p7_1d_acting_user.py || FAILED=1
          run_pytest reverse \
            tests/test_p7_1d_acting_user.py \
            tests/test_state_recovery_privacy_lifecycle.py \
            tests/test_privacy_export_owner_scope.py \
            tests/test_sec001e_od009.py \
            tests/test_sec001e_session_evidence_edges.py \
            tests/test_sec001e_session_evidence.py || FAILED=1

          mapfile -t TEST_ARGS < <(sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' tests/pr_core.txt)
          mapfile -t CHANGED_TEST_ARGS < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$TARGET_SHA" -- ':(glob)tests/**/test_*.py' | sort -u
          )
          for test_path in "${CHANGED_TEST_ARGS[@]}"; do
            test -f "$test_path" || continue
            if [[ " ${TEST_ARGS[*]} " != *" ${test_path} "* ]]; then
              TEST_ARGS+=("$test_path")
            fi
          done
          for test_path in "${TEST_ARGS[@]}"; do test -f "$test_path"; done
          echo "pr_core_changed_selected=${#TEST_ARGS[@]}"
          PR_XML="$ROOT/pr_core_changed.xml"
          EVIDENCE_DIR="$ROOT/regression-evidence"
          "${SEALED_ENV[@]}" python tools/regression_evidence.py init \
            --output-dir "$EVIDENCE_DIR" --status not_started --commit-sha "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1 || FAILED=1
          if "${SEALED_ENV[@]}" python tools/regression_evidence.py run \
            --output-dir "$EVIDENCE_DIR" \
            --reject-global-db-overrides \
            --commit-sha "$TARGET_SHA" \
            -- python -m pytest -q --tb=short --timeout=60 --timeout-method=thread \
            "${TEST_ARGS[@]}" -o junit_family=legacy --junitxml="$PR_XML" >>"$PRIVATE_LOG" 2>&1; then
            PR_RC=0
          else
            PR_RC=$?
            FAILED=1
          fi
          summarize_xml "$PR_XML" pr_core_changed
          [[ $PR_RC -eq 0 ]] && echo "pr_core_changed=passed" || echo "pr_core_changed=failed"

          PG_XML="$ROOT/postgres.xml"
          if AI_CHEF_TEST_POSTGRES_URL='postgresql://postgres:postgres@127.0.0.1:5432/aichef' \
            "${SEALED_ENV[@]}" python -m pytest -q tests/test_sec001e_session_evidence_postgres.py \
            --tb=no --disable-warnings --timeout=90 --timeout-method=thread -o junit_family=legacy --junitxml="$PG_XML" >>"$PRIVATE_LOG" 2>&1; then
            PG_RC=0
          else
            PG_RC=$?
            FAILED=1
          fi
          summarize_xml "$PG_XML" postgres
          [[ $PG_RC -eq 0 ]] && echo "postgres=passed" || echo "postgres=failed"

          if "${SEALED_ENV[@]}" python -m build >>"$PRIVATE_LOG" 2>&1; then
            echo "build=passed"
          else
            echo "build=failed"
            FAILED=1
          fi
          WHEEL="$(find dist -maxdepth 1 -name 'ai_chef_runtime-*.whl' -print -quit)"
          if [[ -n "$WHEEL" ]]; then
            python -m venv "$ROOT/installed"
            if "$ROOT/installed/bin/pip" install --disable-pip-version-check --no-input --no-deps "$WHEEL" >>"$PRIVATE_LOG" 2>&1 && \
               [[ -x "$ROOT/installed/bin/ai-chef-migrate-session-evidence" ]] && \
               "$ROOT/installed/bin/ai-chef-migrate-session-evidence" --help >>"$PRIVATE_LOG" 2>&1; then
              echo "installed_cli=present"
            else
              echo "installed_cli=failed"
              FAILED=1
            fi
          fi

          echo "diagnostic_status=$([[ $FAILED -eq 0 ]] && echo passed || echo failed)"
          exit "$FAILED"
