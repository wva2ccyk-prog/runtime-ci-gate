name: SEC-001E Exact SHA Validation 13cd76d3

on:
  push:
    branches:
      - validate-sec001e-13cd76d3

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aichef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aichef"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"

      - name: Validate exact private SEC-001E head
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "13cd76d386a89c6c986b3bb0268cb92b58378dec"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "validation_status=configuration_error"
            exit 1
          fi

          META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          unset META TARGET_REPOSITORY_ID

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          PRIVATE_LOG="$ROOT/private.log"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() {
            chmod -R u+rwX "$ROOT" 2>/dev/null || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1
          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          echo "exact_sha=verified:$TARGET_SHA"

          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$PRIVATE_LOG" 2>&1 || true
          SEALED_ENV=(env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)

          cd "$SRC"
          "${SEALED_ENV[@]}" python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m pip check >>"$PRIVATE_LOG" 2>&1
          echo "pip_check=passed"

          "${SEALED_ENV[@]}" python -m compileall -q server.py core api scripts tests >>"$PRIVATE_LOG" 2>&1
          echo "compileall=passed"

          SQLITE_XML="$ROOT/sqlite.xml"
          "${SEALED_ENV[@]}" python -m pytest -q \
            tests/test_sec001e_session_evidence.py \
            tests/test_sec001e_session_evidence_edges.py \
            tests/test_privacy_export_owner_scope.py \
            tests/test_state_recovery_privacy_lifecycle.py \
            tests/test_p7_1d_acting_user.py \
            --tb=no --disable-warnings --timeout=60 \
            -o junit_family=legacy --junitxml="$SQLITE_XML" >>"$PRIVATE_LOG" 2>&1
          SQLITE_XML="$SQLITE_XML" python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse(os.environ['SQLITE_XML']).getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=lambda key: sum(int(s.attrib.get(key,'0')) for s in suites)
          print(f"sqlite_tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          PY
          echo "sqlite_sec001e=passed"

          PG_XML="$ROOT/postgres.xml"
          AI_CHEF_TEST_POSTGRES_URL='postgresql://postgres:postgres@127.0.0.1:5432/aichef' \
            "${SEALED_ENV[@]}" python -m pytest -q \
            tests/test_sec001e_session_evidence_postgres.py \
            --tb=no --disable-warnings --timeout=90 \
            -o junit_family=legacy --junitxml="$PG_XML" >>"$PRIVATE_LOG" 2>&1
          PG_XML="$PG_XML" python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse(os.environ['PG_XML']).getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=lambda key: sum(int(s.attrib.get(key,'0')) for s in suites)
          print(f"postgres_tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          assert total('skipped') == 0
          PY
          echo "postgres_concurrent_writes_exports=passed"

          "${SEALED_ENV[@]}" python -m build >>"$PRIVATE_LOG" 2>&1
          WHEEL="$(find dist -maxdepth 1 -name 'ai_chef_runtime-*.whl' -print -quit)"
          [[ -n "$WHEEL" ]]
          python -m venv "$ROOT/installed"
          "$ROOT/installed/bin/pip" install --disable-pip-version-check --no-input --no-deps "$WHEEL" >>"$PRIVATE_LOG" 2>&1
          [[ -x "$ROOT/installed/bin/ai-chef-migrate-session-evidence" ]]
          "$ROOT/installed/bin/ai-chef-migrate-session-evidence" --help >>"$PRIVATE_LOG" 2>&1
          echo "wheel_build=passed"
          echo "installed_cli=present"

          mkdir -p "$ROOT/installed-run/legacy"
          cat > "$ROOT/installed-run/legacy/chef_cockpit_sessions_v12.json" <<'JSON'
          {"schema":"chef_cockpit_sessions_v12","sessions":{"chef_installed":{"schema":"chef_cockpit_session_v12","session_id":"chef_installed","user_id":"creator","domain":"cooking","status":"active","marker":"installed-artifact","started_at":"2026-08-29T00:00:00+00:00","updated_at":"2026-08-29T00:00:00+00:00"}}}
          JSON
          (
            cd "$ROOT/installed-run"
            export PYTHONPATH=""
            export AI_CHEF_DB_PATH="$ROOT/installed-run/runtime.sqlite3"
            "$ROOT/installed/bin/python" - <<'PY' >>"$PRIVATE_LOG" 2>&1
          from pathlib import Path
          import core
          from core import accounts
          assert 'installed' in str(Path(core.__file__).resolve())
          assert accounts.public_account('creator') is not None
          PY
            "$ROOT/installed/bin/ai-chef-migrate-session-evidence" --legacy-root "$ROOT/installed-run/legacy" >>"$PRIVATE_LOG" 2>&1
            "$ROOT/installed/bin/python" - <<'PY' >>"$PRIVATE_LOG" 2>&1
          from core.auth_context import desktop_owner_context
          from core import session_evidence_repository as repo
          row, revision = repo.load_snapshot(desktop_owner_context(), repo.KIND_COCKPIT, 'chef_installed')
          assert row['marker'] == 'installed-artifact'
          assert revision == 1
          PY
          )
          echo "installed_artifact_migration=passed"
          echo "installed_artifact_path=$ROOT/installed"
          echo "validation_status=passed"
