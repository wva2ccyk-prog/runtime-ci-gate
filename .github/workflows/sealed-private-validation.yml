name: Sealed Private Validation
on:
  push:
    branches: [sec-001g-red-gate]
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: aichef_test
          POSTGRES_USER: aichef
          POSTGRES_PASSWORD: aichef-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aichef -d aichef_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with: {python-version: "3.11"}
      - name: Validate exact SEC-001G head
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "63928332318967b2a4686f726c3b5645e4d01016"
        run: |
          set -Eeuo pipefail; umask 077; printf '::add-mask::%s\n' "$TARGET_TOKEN"
          META="$(curl -fsS -H "Authorization: Bearer ${TARGET_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          REPO="$(printf '%s' "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("private") is True; print(d["full_name"])')"; printf '::add-mask::%s\n' "$REPO"
          ROOT="$(mktemp -d)"; SRC="$ROOT/source"; LOG="$ROOT/private.log"; JUNIT="$ROOT/results.xml"; ASK="$ROOT/askpass.sh"; trap 'rm -rf "$ROOT"' EXIT INT TERM
          cat > "$ASK" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in *Username*) echo x-access-token;; *Password*) echo "$TARGET_TOKEN";; *) exit 1;; esac
          EOF
          chmod 700 "$ASK"; export GIT_ASKPASS="$ASK" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC"; git -C "$SRC" remote add origin "https://github.com/${REPO}.git"; git -C "$SRC" fetch -q --depth=1 origin "$TARGET_SHA"; git -C "$SRC" checkout -q --detach FETCH_HEAD; [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          unset TARGET_TOKEN GIT_ASKPASS META REPO TARGET_REPOSITORY_ID; rm -f "$ASK"; git -C "$SRC" remote remove origin >/dev/null 2>&1 || true; cd "$SRC"
          python -m pip install --disable-pip-version-check --no-input ".[dev]" >"$LOG" 2>&1; python -m pip check >>"$LOG" 2>&1; echo dependency_validation=passed
          python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$LOG" 2>&1; echo compile=passed
          python -m pytest -q --tb=no --disable-warnings --timeout=120 -o junit_family=legacy --junitxml="$JUNIT" >"$LOG" 2>&1
          JUNIT_PATH="$JUNIT" python - <<'PY'
          import os,xml.etree.ElementTree as ET
          root=ET.parse(os.environ['JUNIT_PATH']).getroot(); suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          def total(k): return sum(int(s.attrib.get(k,'0')) for s in suites)
          print(f"tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          PY
          echo full_pytest=passed
          AI_CHEF_DATABASE_BACKEND=postgresql \
          AI_CHEF_DATABASE_URL='postgresql://aichef:aichef-test-only@127.0.0.1:5432/aichef_test' \
          AI_CHEF_DB_AUTO_MIGRATE=1 \
          AI_CHEF_ALLOW_POSTGRES_TEST_RESET=1 \
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from core import database
          from core.auth_context import AuthContext, ROLE_USER
          from core import catalog_gap_repository as gaps
          database.close_pools(); database.reset_for_tests()
          now=database.utc_now_iso()
          with database.transaction() as conn:
              for sid,uid in (("pg-owner-a","pgA"),("pg-owner-b","pgB")):
                  conn.execute("INSERT INTO users(subject_id, uid, display_name, created_at, disabled) VALUES (?, ?, ?, ?, 0)",(sid,uid,uid,now))
                  conn.execute("INSERT INTO user_roles(subject_id, role, granted_at, granted_by) VALUES (?, 'user', ?, ?)",(sid,now,"sealed"))
          a=AuthContext(subject_id="pg-owner-a",uid="pgA",roles=frozenset({ROLE_USER}),auth_method="sealed")
          b=AuthContext(subject_id="pg-owner-b",uid="pgB",roles=frozenset({ROLE_USER}),auth_method="sealed")
          created=gaps.record_gap(a,"sealed postgres gap",domain="cooking",entity_hint="ingredient"); gid=created["gap"]["gap_id"]; rev=created["gap"]["revision"]
          try: gaps.review_gap(b,gid,"accept",expected_revision=rev)
          except gaps.CatalogGapNotFound: pass
          else: raise AssertionError("cross-owner review succeeded")
          def attempt(label):
              try: return ("ok",gaps.review_gap(a,gid,label,expected_revision=rev)["gap"]["revision"])
              except gaps.CatalogGapRevisionConflict: return ("conflict",None)
          with ThreadPoolExecutor(max_workers=2) as p: results=list(p.map(attempt,("first","second")))
          assert sorted(k for k,_ in results)==["conflict","ok"],results
          final=gaps.list_gaps(a,status="reviewed",limit=10); assert len(final["items"])==1 and final["items"][0]["revision"]==rev+1
          print("postgres_owner_isolation=passed"); print("postgres_concurrency=passed"); database.close_pools()
          PY
          python -m build >>"$LOG" 2>&1; WHEEL=(dist/*.whl); SDIST=(dist/*.tar.gz); [[ -e "${WHEEL[0]}" && -e "${SDIST[0]}" ]]; echo wheel=passed; echo sdist=passed
          python -m venv --system-site-packages "$ROOT/installed"; "$ROOT/installed/bin/python" -m pip install --disable-pip-version-check --no-input --force-reinstall --no-deps "${WHEEL[0]}" >>"$LOG" 2>&1
          (cd "$ROOT"; PYTHONPATH= "$ROOT/installed/bin/ai-chef-migrate-catalog-gaps" --help >/dev/null)
          echo installed_artifact=passed; echo validation_status=passed
