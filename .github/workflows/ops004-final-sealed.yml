name: OPS004 Final Sealed Validation

on:
  push:
    branches:
      - ops004-final-sealed

permissions: {}

jobs:
  validate:
    name: Validate sealed exact target
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: ops004_ci
          POSTGRES_PASSWORD: ops004_ci_ephemeral
          POSTGRES_DB: ops004_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops004_ci -d ops004_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"

      - name: Run final sealed validation
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "60b56181ee8b419cca7d607c9a270955853bf1f4"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "validation_status=configuration_error"
            exit 1
          fi

          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          SOURCE_VENV="$ROOT/source-venv"
          INSTALL_VENV="$ROOT/install-venv"
          PRIVATE_LOG="$ROOT/private.log"
          JUNIT="$ROOT/results.xml"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() { chmod -R u+rwX "$ROOT" 2>/dev/null || true; rm -rf "$ROOT"; }
          trap cleanup EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1
          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD 2>>"$PRIVATE_LOG")"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]]
          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY REPOSITORY_META TARGET_REPOSITORY_ID
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$PRIVATE_LOG" 2>&1 || true

          SEALED_ENV=(env -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STEP_SUMMARY -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL)

          python -m venv "$SOURCE_VENV" >>"$PRIVATE_LOG" 2>&1
          SRC_PY="$SOURCE_VENV/bin/python"
          "$SRC_PY" -m pip install --disable-pip-version-check --no-input --upgrade pip >>"$PRIVATE_LOG" 2>&1
          cd "$SRC"
          "$SRC_PY" -m pip install --disable-pip-version-check --no-input ".[dev]" build >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" "$SRC_PY" -m pip check >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" "$SRC_PY" -m compileall -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" "$SRC_PY" -m build >>"$PRIVATE_LOG" 2>&1

          shopt -s nullglob
          WHEELS=("$SRC"/dist/*.whl)
          SDISTS=("$SRC"/dist/*.tar.gz)
          [[ "${#WHEELS[@]}" -eq 1 && "${#SDISTS[@]}" -eq 1 ]]
          WHEEL="${WHEELS[0]}"

          python -m venv "$INSTALL_VENV" >>"$PRIVATE_LOG" 2>&1
          INSTALL_PY="$INSTALL_VENV/bin/python"
          "$INSTALL_PY" -m pip install --disable-pip-version-check --no-input --upgrade pip >>"$PRIVATE_LOG" 2>&1
          "$INSTALL_PY" -m pip install --disable-pip-version-check --no-input "$WHEEL" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" "$INSTALL_PY" -m pip check >>"$PRIVATE_LOG" 2>&1

          mkdir -p "$ROOT/installed-smoke" "$ROOT/installed-home"
          cd "$ROOT/installed-smoke"
          HOME="$ROOT/installed-home" "${SEALED_ENV[@]}" "$INSTALL_VENV/bin/ai-chef-postgres-recovery" --help >>"$PRIVATE_LOG" 2>&1
          HOME="$ROOT/installed-home" AI_CHEF_NO_BROWSER=1 "${SEALED_ENV[@]}" "$INSTALL_VENV/bin/ai-chef-runtime" --check >>"$PRIVATE_LOG" 2>&1

          PG_USER="ops004_ci"
          PG_PASSWORD="ops004_ci_ephemeral"
          PG_PORT="5432"
          PG_DB="ops004_ci"
          printf -v PG_URL 'postgresql://%s:%s@127.0.0.1:%s/%s' "$PG_USER" "$PG_PASSWORD" "$PG_PORT" "$PG_DB"
          printf '::add-mask::%s\n' "$PG_PASSWORD"
          printf '::add-mask::%s\n' "$PG_URL"

          cd "$SRC"
          set +e
          AI_CHEF_TEST_POSTGRES_URL="$PG_URL" \
          AI_CHEF_TEST_INSTALLED_BIN_DIR="$INSTALL_VENV/bin" \
          "${SEALED_ENV[@]}" "$SRC_PY" -m pytest -q --tb=no --disable-warnings --timeout=60 \
            -o junit_family=legacy --junitxml="$JUNIT" >"$PRIVATE_LOG" 2>&1
          TEST_RC=$?
          set -e

          COUNTS="$(JUNIT_PATH="$JUNIT" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          def total(name):
              return sum(int(s.attrib.get(name, "0")) for s in suites)
          print(f"tests={total('tests')} failures={total('failures')} errors={total('errors')} skipped={total('skipped')}")
          PY
          )"
          echo "$COUNTS"
          echo "sealed_sha=$ACTUAL_SHA"
          if [[ "$TEST_RC" -ne 0 ]]; then
            echo "validation_status=failed"
            exit 1
          fi

          echo "pip_check=passed"
          echo "compile=passed"
          echo "wheel=passed"
          echo "sdist=passed"
          echo "repository_only_packaging_boundary=passed"
          echo "clean_venv_install=passed"
          echo "installed_recovery_help=passed"
          echo "installed_runtime_check=passed"
          echo "live_postgresql=passed"
          echo "validation_status=passed"
