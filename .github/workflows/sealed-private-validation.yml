name: Sealed Private Validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact private commit SHA to validate
        required: true
        type: string
  push:
    branches:
      - main

permissions: {}

jobs:
  validate:
    name: Validate sealed target
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Run sealed validation
        id: validation
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: ${{ inputs.sha || '5495265241767a336762680f181c62c66976b470' }}
        run: |
          set -Eeuo pipefail
          umask 077

          printf '::add-mask::%s\n' "$TARGET_TOKEN"

          if [[ -z "$TARGET_TOKEN" || ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "validation_status=configuration_error"
            exit 1
          fi

          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          unset REPOSITORY_META TARGET_REPOSITORY_ID

          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          PRIVATE_LOG="$ROOT/private.log"
          JUNIT="$ROOT/results.xml"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() {
            chmod -R u+rwX "$ROOT" 2>/dev/null || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT INT TERM

          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git init -q "$SRC" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$PRIVATE_LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$PRIVATE_LOG" 2>&1

          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD 2>>"$PRIVATE_LOG")"
          TREE_SHA="$(git -C "$SRC" rev-parse 'HEAD^{tree}' 2>>"$PRIVATE_LOG")"
          if [[ "$ACTUAL_SHA" != "$TARGET_SHA" ]]; then
            echo "validation_status=checkout_mismatch"
            exit 1
          fi

          unset TARGET_TOKEN GIT_ASKPASS TARGET_REPOSITORY TARGET_SHA
          rm -f "$ASKPASS"
          git -C "$SRC" remote remove origin >>"$PRIVATE_LOG" 2>&1 || true

          SEALED_ENV=(
            env
            -u GITHUB_ENV
            -u GITHUB_OUTPUT
            -u GITHUB_PATH
            -u GITHUB_STEP_SUMMARY
            -u GITHUB_TOKEN
            -u ACTIONS_RUNTIME_TOKEN
            -u ACTIONS_RUNTIME_URL
            -u ACTIONS_CACHE_URL
            -u ACTIONS_RESULTS_URL
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
            -u ACTIONS_ID_TOKEN_REQUEST_URL
          )

          EVIDENCE_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          cd "$SRC"
          "${SEALED_ENV[@]}" python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m pip check >>"$PRIVATE_LOG" 2>&1
          "${SEALED_ENV[@]}" python -m compileall -q server.py core api baking cooking data tests tools food cost coffee wine simulators >>"$PRIVATE_LOG" 2>&1
          for script in static/main.js static/ui-events.js static/lab-ui-events.js; do
            if [[ -f "$script" ]]; then
              node --check "$script" >>"$PRIVATE_LOG" 2>&1
            fi
          done

          set +e
          "${SEALED_ENV[@]}" python -m pytest -q --tb=no --disable-warnings --timeout=60 \
            -o junit_family=legacy --junitxml="$JUNIT" >"$PRIVATE_LOG" 2>&1
          TEST_RC=$?
          set -e

          COUNTS="$(JUNIT_PATH="$JUNIT" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          def total(name):
              return sum(int(s.attrib.get(name, "0")) for s in suites)
          print(
              f"tests={total('tests')} failures={total('failures')} "
              f"errors={total('errors')} skipped={total('skipped')}"
          )
          PY
          )"
          echo "$COUNTS"

          if [[ "$TEST_RC" -ne 0 ]]; then
            echo "package_build=not_run"
            echo "validation_status=failed"
            exit 1
          fi

          "${SEALED_ENV[@]}" python -m build >"$PRIVATE_LOG" 2>&1
          WHEELS=(dist/*.whl)
          SDISTS=(dist/*.tar.gz)
          if [[ ! -e "${WHEELS[0]}" || ! -e "${SDISTS[0]}" ]]; then
            echo "package_build=missing_artifact"
            echo "validation_status=failed"
            exit 1
          fi

          EVIDENCE_FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          PUBLIC_EVIDENCE="${RUNNER_TEMP}/sealed-regression-evidence"
          rm -rf "$PUBLIC_EVIDENCE"
          mkdir -p "$PUBLIC_EVIDENCE"
          EVIDENCE_DIR="$PUBLIC_EVIDENCE" \
          JUNIT_PATH="$JUNIT" \
          COMMIT_SHA="$ACTUAL_SHA" \
          TREE_SHA="$TREE_SHA" \
          STARTED_AT="$EVIDENCE_STARTED_AT" \
          FINISHED_AT="$EVIDENCE_FINISHED_AT" \
          python - <<'PY'
          import json
          import os
          import platform
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path(os.environ["EVIDENCE_DIR"])
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          def total(name):
              return sum(int(s.attrib.get(name, "0")) for s in suites)
          tests = total("tests")
          failed = total("failures")
          errors = total("errors")
          skipped = total("skipped")
          passed = tests - failed - errors - skipped
          commit_sha = os.environ["COMMIT_SHA"]
          tree_sha = os.environ["TREE_SHA"]
          manifest = {
              "schema": "ai_chef_regression_evidence_v2",
              "status": "passed",
              "started_at": os.environ["STARTED_AT"],
              "finished_at": os.environ["FINISHED_AT"],
              "exit_code": 0,
              "test_summary": {
                  "parsed": True,
                  "passed": passed,
                  "failed": failed,
                  "errors": errors,
                  "skipped": skipped,
                  "warnings": 0,
              },
              "phases": {
                  name: {"status": "passed"}
                  for name in (
                      "initialize", "dependency_install", "pip_check",
                      "compileall", "javascript_checks", "pytest"
                  )
              },
              "source": {
                  "authoritative": {"commit_sha": commit_sha, "tree_sha": tree_sha},
                  "checked_out": {"commit_sha": commit_sha, "tree_sha": tree_sha},
              },
              "files": {
                  "command": "command.txt",
                  "environment": "environment.json",
                  "failure_summary": "pytest-failures.txt",
                  "git_integrity": "git-integrity.json",
                  "pytest_log": "pytest-full.log",
              },
          }
          (out / "manifest.json").write_text(json.dumps(manifest, sort_keys=True), encoding="utf-8")
          (out / "command.txt").write_text(
              json.dumps({"command": ["python", "-m", "pytest"], "scope": "full"}, sort_keys=True),
              encoding="utf-8",
          )
          (out / "environment.json").write_text(
              json.dumps({
                  "schema": "ai_chef_environment_v1",
                  "os": "Linux",
                  "python": platform.python_version(),
                  "runner": "github-hosted",
                  "evidence_scope": "sanitized-sealed",
              }, sort_keys=True),
              encoding="utf-8",
          )
          (out / "git-integrity.json").write_text(
              json.dumps({"commit_sha": commit_sha, "tree_sha": tree_sha, "dirty": False}, sort_keys=True),
              encoding="utf-8",
          )
          (out / "pytest-failures.txt").write_text("", encoding="utf-8")
          (out / "pytest-full.log").write_text(
              f"tests={tests} passed={passed} failures={failed} errors={errors} skipped={skipped}\n",
              encoding="utf-8",
          )
          PY

          EVIDENCE_TAR="${RUNNER_TEMP}/sealed-regression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ACTUAL_SHA}.tar.gz"
          tar -czf "$EVIDENCE_TAR" -C "$PUBLIC_EVIDENCE" .
          echo "evidence_path=$EVIDENCE_TAR" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "package_build=passed"
          echo "validation_status=passed"

      - name: Upload sanitized verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.validation.outputs.evidence_sha }}
          path: ${{ steps.validation.outputs.evidence_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
