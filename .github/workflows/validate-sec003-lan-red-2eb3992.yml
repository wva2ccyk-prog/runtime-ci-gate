name: SEC-003 LAN RED Witness

on:
  push:
    branches:
      - validate-sec003-lan-red-2eb3992

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11"
      - name: Prove LAN regression tests are red
        shell: bash
        env:
          TARGET_REPOSITORY_ID: "1317466526"
          TARGET_TOKEN: ${{ secrets.AI || secrets.PRIVATE_READ_TOKEN || secrets.PRIVATE_RUNTIME_READ_TOKEN }}
          TARGET_SHA: "2eb3992a0018b21876c74830172990c8f6a67226"
        run: |
          set -Eeuo pipefail
          umask 077
          printf '::add-mask::%s\n' "$TARGET_TOKEN"
          REPOSITORY_META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TARGET_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repositories/${TARGET_REPOSITORY_ID}")"
          TARGET_REPOSITORY="$(printf '%s' "$REPOSITORY_META" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("private") is True; print(data["full_name"])')"
          printf '::add-mask::%s\n' "$TARGET_REPOSITORY"
          ROOT="$(mktemp -d)"
          SRC="$ROOT/source"
          LOG="$ROOT/private.log"
          JUNIT="$ROOT/red.xml"
          ASKPASS="$ROOT/askpass.sh"
          cleanup() { chmod -R u+rwX "$ROOT" 2>/dev/null || true; rm -rf "$ROOT"; }
          trap cleanup EXIT INT TERM
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TARGET_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git init -q "$SRC" >>"$LOG" 2>&1
          git -C "$SRC" remote add origin "https://github.com/${TARGET_REPOSITORY}.git" >>"$LOG" 2>&1
          git -C "$SRC" fetch --no-tags --depth=1 origin "$TARGET_SHA" >>"$LOG" 2>&1
          git -C "$SRC" checkout --quiet --detach FETCH_HEAD >>"$LOG" 2>&1
          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TARGET_SHA" ]]
          unset TARGET_TOKEN TARGET_REPOSITORY GIT_ASKPASS
          rm -f "$ASKPASS"
          cd "$SRC"
          python -m pip install --disable-pip-version-check --no-input ".[dev]" >>"$LOG" 2>&1
          set +e
          python -m pytest -q tests/test_sec003_startup_safety.py \
            -k 'lan_ or desktop_host_boundary_is_unchanged' \
            --tb=no --disable-warnings -o junit_family=legacy --junitxml="$JUNIT" >>"$LOG" 2>&1
          STATUS=$?
          set -e
          [[ "$STATUS" -ne 0 ]]
          JUNIT_PATH="$JUNIT" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ["JUNIT_PATH"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          total = lambda name: sum(int(s.attrib.get(name, "0")) for s in suites)
          tests, failures, errors = total("tests"), total("failures"), total("errors")
          print(f"red_tests={tests} red_failures={failures} red_errors={errors}")
          if (tests, failures, errors) != (5, 2, 0):
              raise SystemExit(1)
          PY
          echo "red_contract=observed"
